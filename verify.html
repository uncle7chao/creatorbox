<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreatorBox 解析验证台</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --fg:#e8eaed; --fg2:#9aa3b2; --fg3:#6b7280;
    --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --info:#60a5fa;
    --accent:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--fg3);font-size:13px;margin-bottom:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:18px;margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 12px;color:var(--fg2);font-weight:600}
  textarea{width:100%;min-height:88px;background:var(--panel2);color:var(--fg);
    border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.6 monospace;
    resize:vertical}
  textarea:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
  button{background:var(--accent);color:#1a1206;border:none;border-radius:8px;
    padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  button.ghost{background:transparent;color:var(--fg2);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .samples{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .samples button{background:var(--panel2);color:var(--fg2);border:1px solid var(--line);
    padding:5px 11px;font-size:12px;font-weight:400}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;
    font-weight:600;vertical-align:middle}
  .pill.ok{background:rgba(34,197,94,.14);color:var(--ok)}
  .pill.err{background:rgba(239,68,68,.14);color:var(--err)}
  .pill.warn{background:rgba(245,158,11,.14);color:var(--warn)}
  .kv{display:grid;grid-template-columns:88px 1fr;gap:6px 14px;font-size:13px;align-items:start}
  .kv dt{color:var(--fg3)}
  .kv dd{margin:0;word-break:break-all}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .thumb{background:var(--panel2);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .thumb img,.thumb video{width:100%;display:block;aspect-ratio:1;object-fit:cover}
  .meta-list{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg2)}
  .meta-list b{color:var(--fg);font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--fg3);font-weight:600;font-size:11.5px}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--fg2)}
  .hint{color:var(--fg3);font-size:12px;margin-top:8px;line-height:1.7}
  a{color:var(--info)}
  code{background:var(--panel2);padding:1.5px 6px;border-radius:4px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(0,0,0,.25);
    border-top-color:#1a1206;border-radius:50%;animation:sp .7s linear infinite;
    vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.35);
    border-radius:8px;padding:12px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>CreatorBox 解析验证台</h1>
  <div class="sub">粘贴任意平台链接或分享文案 → 实时调 127.0.0.1:8080 解析 · 零浏览器依赖</div>

  <div class="card">
    <h2>① 粘贴链接 / 分享文案</h2>
    <textarea id="in" placeholder="支持：
· 裸链接  https://www.douyin.com/xxx
· 分享文案（含【标题 - 作者 | 小红书】的小红书分享内容，标题提取更准）
· App 复制文案  「复制打开抖音…」"></textarea>
    <div class="samples" id="samples"></div>
    <div class="row">
      <button id="go">解析</button>
      <button class="ghost" id="clear">清空</button>
      <span id="status" style="font-size:12.5px;color:var(--fg3)"></span>
    </div>
  </div>

  <div id="out"></div>

  <div class="card" style="margin-top:8px">
    <h2>服务状态</h2>
    <div id="health" class="hint">加载中…</div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8080';
const $ = id => document.getElementById(id);

const SAMPLES = [
  ['抖音图集', 'https://v.douyin.com/hZMkNvXLtLc/'],
  ['B站', 'https://www.bilibili.com/video/BV1GJ411x7h7'],
  ['好看视频', 'https://haokan.baidu.com/v?vid=1688233510589355861'],
  ['搜狐(30s内)', 'https://tv.sohu.com/v/MjAyNjA5MzAvbjYyMDI1MzY2MC5zaHRtbA==.html'],
  ['搜狐(76s截断)', 'https://tv.sohu.com/v/MjAyNjA5MjgvbjYyMDI1MzA0Ni5zaHRtbA==.html'],
  ['微博', 'https://weibo.com/tv/show/1034:5343195622473745?mid=5343196424963244'],
  ['AcFun', 'https://www.acfun.cn/v/ac48890260'],
  ['小红书图集', '50 【林萧，你真成主编了  - 鲲鹏 | 小红书 - 你的生活兴趣社区】 😆 XPv8W4Czmq5UbBq 😆 https://www.xiaohongshu.com/discovery/item/6a827209000000002701cde0?xsec_token=AB7esHwJgaSaSlhVeq7GJlZN8Fi1J6MrUIjviv8R_APxM=&xsec_source=pc_share'],
  ['小红书视频', '16 【一部上映十天却惨遭下架的电影，却赚足了观众的眼泪 虐心虐恋 古装玄幻 虐心片段 - 怪咖解说 | 小红书 - 你的生活兴趣社区】 😆 kkceQvt29agF6eV 😆 https://www.xiaohongshu.com/discovery/item/6a72adee0000000033036edf?xsec_token=ABgKYGq72MJJJWO8OVQh3MtnwjRfcqKYxsujnzRIHNdTA=&xsec_source=pc_share'],
  ['快手(竖屏)', 'https://www.kuaishou.com/f/X-3M7HpE9Kh3sh1V'],
  ['快手(横屏)', 'https://www.kuaishou.com/f/X3n2Z5bXSt9g1wp'],
];

SAMPLES.forEach(([tag, txt]) => {
  const b = document.createElement('button');
  b.textContent = tag;
  b.onclick = () => { $('in').value = txt; run(); };
  $('samples').appendChild(b);
});

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function fmtBytes(n){
  if (!n && n !== 0) return '-';
  if (n >= 1048576) return (n/1048576).toFixed(2) + ' MB';
  if (n >= 1024) return (n/1024).toFixed(0) + ' KB';
  return n + ' B';
}
function fmtDur(s){
  if (!s && s !== 0) return '-';
  s = Math.round(s);
  const m = Math.floor(s/60);
  return m ? `${m}分${s%60}秒` : `${s}秒`;
}
function fmtNum(n){
  if (n === null || n === undefined) return '-';
  if (n >= 1e8) return (n/1e8).toFixed(1).replace(/\.0$/,'') + '亿';
  if (n >= 1e4) return (n/1e4).toFixed(1).replace(/\.0$/,'') + '万';
  return String(n);
}

async function run(){
  const text = $('in').value.trim();
  if (!text) return;
  $('go').disabled = true;
  $('status').innerHTML = '<span class="spin"></span>解析中…';
  $('out').innerHTML = '';
  const t0 = performance.now();
  try{
    const res = await fetch(API + '/api/parse', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text, quality:'1080p', no_cache:true })
    });
    const d = await res.json();
    const ms = (performance.now() - t0).toFixed(0);
    if (!d.success){
      $('status').innerHTML = `<span class="pill err">失败</span> ${ms}ms`;
      $('out').innerHTML = `<div class="card"><div class="err-box">
        <b>解析失败</b><br>${esc(d.error||'未知错误')}
        ${d.hint?`<div style="margin-top:6px;color:var(--fg3)">${esc(d.hint)}</div>`:''}
        ${d.fallback_url?`<div style="margin-top:6px">已降级到：<a href="${esc(d.fallback_url)}" target="_blank">${esc(d.fallback_url.slice(0,70))}…</a></div>`:''}
      </div></div>`;
      return;
    }
    $('status').innerHTML = `<span class="pill ok">成功</span> ${ms}ms`;
    render(d);
  }catch(e){
    $('status').innerHTML = `<span class="pill err">请求失败</span>`;
    $('out').innerHTML = `<div class="card"><div class="err-box">
      连不上 ${API} —— 服务可能没启动。<br>
      <span class="mono">在 PowerShell 里执行：</span><br>
      <code>cd D:\WorkBuddyFILE\CreatorBox\server</code><br>
      <code>python -m uvicorn app.main:app --host 127.0.0.1 --port 8080</code>
    </div></div>`;
  }finally{
    $('go').disabled = false;
  }
}

function render(d){
  const m = d.meta || {};
  const st = m.stats || {};
  const parts = [];

  // 概览
  const badges = [];
  badges.push(`<span class="pill ok">${esc(d.platform)}</span>`);
  badges.push(`<span class="pill ${d.type==='video'?'ok':'warn'}">${d.type==='video'?'视频':(d.type==='image'?'图集':d.type)}</span>`);
  if (d.truncated) badges.push(`<span class="pill warn">⚠ 截断</span>`);
  if (d.merge_required) badges.push(`<span class="pill warn">需服务端合并</span>`);
  if (d.no_watermark) badges.push(`<span class="pill ok">无水印</span>`);
  if (d.need_proxy) badges.push(`<span class="pill warn">需中转</span>`);

  const basic = [
    ['平台', badges.join(' ')],
    ['标题', esc(m.title || d.title || '—') + (d.title_source ? ` <span class="mono">(来源 ${esc(d.title_source)})</span>` : '')],
    ['文案', esc(m.description || d.description || '—')],
    ['作者', esc(m.author_name || '—') + (m.author_id ? ` <span class="mono">@${esc(m.author_id)}</span>` : '')],
    ['时长', fmtDur(m.duration_s)],
    ['发布', esc(m.publish_time || m.publish_time_text || '—')],
  ];
  if (d.orientation) basic.push(['方向', d.orientation === 'vertical' ? '竖屏' : '横屏']);
  if (d.user_warning) basic.push(['⚠ 提示', `<span style="color:var(--warn)">${esc(d.user_warning)}</span>`]);

  parts.push(`<div class="card"><h2>② 解析结果</h2>
    <dl class="kv">${basic.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
  </div>`);

  // 统计
  const statKeys = [['like','点赞'],['comment','评论'],['collect','收藏'],['share','分享'],
                    ['view','播放'],['danmaku','弹幕'],['coin','投币']];
  const stHtml = statKeys.filter(([k]) => st[k] !== undefined)
    .map(([k,label]) => {
      const txt = (m.stats_text||{})[k];
      return `<div><span style="color:var(--fg3)">${label}</span> <b>${txt ? esc(txt) : fmtNum(st[k])}</b></div>`;
    }).join('');
  if (stHtml) parts.push(`<div class="card"><h2>③ 互动数据</h2>
    <div class="meta-list">${stHtml}</div></div>`);

  // 标签
  if (m.tags && m.tags.length){
    parts.push(`<div class="card"><h2>话题标签</h2>
      <div class="samples">${m.tags.map(t=>`<span class="pill" style="background:var(--panel2);color:var(--fg2)">#${esc(t)}</span>`).join('')}</div>
    </div>`);
  }

  // 封面
  if (m.cover){
    parts.push(`<div class="card"><h2>封面（无水印原图）</h2>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))">
        <div class="thumb" style="aspect-ratio:auto">
          <img src="${esc(m.cover)}" referrerpolicy="no-referrer"
               onerror="this.parentNode.innerHTML='<div style=\\'padding:16px;font-size:12px;color:var(--fg3)\\'>图片加载失败（可能防盗链）</div>'"
               style="aspect-ratio:auto;max-height:260px;object-fit:contain">
        </div>
      </div>
      <div class="hint mono" style="word-break:break-all">${esc(m.cover)}</div>
    </div>`);
  }

  // 视频
  if (d.type === 'video' && d.video_url){
    const opts = d.options || [];
    parts.push(`<div class="card"><h2>视频地址（${opts.length} 档）</h2>
      <div style="margin-bottom:10px">
        <video src="${esc(d.video_url)}" controls preload="metadata"
               style="width:100%;max-width:340px;border-radius:8px;background:#000"></video>
      </div>
      <table><thead><tr><th>档位</th><th>宽×高</th><th>带签名</th><th>地址</th></tr></thead><tbody>
        ${opts.map(o=>`<tr>
          <td>${esc(o.gear||'-')}</td>
          <td class="mono">${o.width?o.width+'×'+o.height:'-'}</td>
          <td>${o.signed?'<span class="pill warn">是</span>':'<span class="pill ok">否</span>'}</td>
          <td class="mono" style="word-break:break-all;max-width:340px">
            <a href="${esc(o.url)}" target="_blank">${esc(o.url.slice(0,58))}…</a></td>
        </tr>`).join('')}
      </tbody></table>
      ${d.m3u8_note?`<div class="hint">${esc(d.m3u8_note)}</div>`:''}
      ${d.entry_note?`<div class="hint">${esc(d.entry_note)}</div>`:''}
    </div>`);
  }

  // 图集
  if ((d.images||[]).length){
    parts.push(`<div class="card"><h2>图集（${d.image_count} 张 · 无水印原图）</h2>
      <div class="grid">${d.images.map(im=>`
        <div class="thumb">
          <img src="${esc(im.url)}" referrerpolicy="no-referrer" loading="lazy"
               onerror="this.parentNode.innerHTML='<div style=\\'padding:16px;font-size:11px;color:var(--fg3);text-align:center\\'>加载失败</div>'">
          <div style="padding:5px 7px;font-size:10.5px;color:var(--fg3)" class="mono">
            ${im.width||'?'}×${im.height||'?'} · ${im.format||''}</div>
        </div>`).join('')}</div>
    </div>`);
  }

  // 特有信息
  const extra = m.extra || {};
  if (Object.keys(extra).length){
    const names = {channel:'频道',user_ip:'IP 属地',keyword:'关键词',upload_region:'上传地',
      verified_reason:'认证',ip_location:'发布地',orientation:'方向',copyright:'版权',
      aid:'aid',cid:'cid',photo_id:'photoId',work_id:'workId',kwai_id:'快手号',
      note_type_raw:'笔记类型',tname:'分区',url_short:'短链'};
    const rows = Object.entries(extra)
      .map(([k,v]) => `<dt>${esc(names[k]||k)}</dt><dd class="mono">${esc(v)}</dd>`).join('');
    parts.push(`<div class="card"><h2>平台特有信息</h2>
      <dl class="kv">${rows}</dl></div>`);
  }

  // 原始 JSON
  parts.push(`<div class="card"><h2>完整响应（meta 统一字段）</h2>
    <details><summary style="cursor:pointer;color:var(--fg3);font-size:13px">展开查看 meta</summary>
    <pre class="mono" style="background:var(--panel2);padding:12px;border-radius:8px;
    overflow:auto;max-height:420px;font-size:11.5px;margin-top:10px">${
      esc(JSON.stringify(m,null,2))}</pre></details>
    <details style="margin-top:8px"><summary style="cursor:pointer;color:var(--fg3);font-size:13px">展开查看完整响应</summary>
    <pre class="mono" style="background:var(--panel2);padding:12px;border-radius:8px;
    overflow:auto;max-height:420px;font-size:11.5px;margin-top:10px">${
      esc(JSON.stringify(d,null,2))}</pre></details>
  </div>`);

  $('out').innerHTML = parts.join('');
}

async function health(){
  try{
    const d = await (await fetch(API + '/api/health')).json();
    const pure = d.pure_http || {};
    const names = {douyin:'抖音',bilibili:'B站',haokan:'好看视频',sohu:'搜狐',
      weibo:'微博',acfun:'AcFun',xiaohongshu:'小红书',kuaishou:'快手'};
    const rows = Object.keys(pure).map(k => {
      const base = k.replace('_pure','');
      return `<tr><td>${esc(names[base]||base)}</td>
        <td><span class="pill ${pure[k].ready?'ok':'err'}">${pure[k].ready?'ready':'down'}</span></td>
        <td class="mono">${esc(pure[k].method||'')}</td></tr>`;
    }).join('');
    $('health').innerHTML =
      `<div class="meta-list" style="margin-bottom:10px">
        <div><span style="color:var(--fg3)">引擎</span> <b>${esc(d.engine)}</b></div>
        <div><span style="color:var(--fg3)">平台数</span> <b>${(d.platforms||[]).length}</b></div>
        <div><span style="color:var(--fg3)">浏览器依赖</span>
             <b>${d.browser_available?'需要':'不需要'}</b></div>
      </div>
      <table><thead><tr><th>平台</th><th>状态</th><th>方式</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }catch(e){
    $('health').innerHTML = `<span class="pill err">服务未启动</span> &nbsp;启动命令见上方提示`;
  }
}

$('go').onclick = run;
$('clear').onclick = () => { $('in').value=''; $('out').innerHTML=''; $('status').innerHTML=''; };
$('in').addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key === 'Enter') run();
});
health();
setInterval(health, 20000);
</script>
</body>
</html>
