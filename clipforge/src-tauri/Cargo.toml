[package]
name = "clipforge"
version = "0.1.0"
description = "星创映画（CreatorBox）· 桌面剪辑版 - ClipForge"
authors = ["ClipForge / 星创映画"]
edition = "2021"
rust-version = "1.93"

# 注意：本 crate 名为 clipforge（代码内标识 ClipForge）
# 许可信息见项目根目录 LICENSE（AGPL-3.0-or-later）
license = "AGPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2.x
tauri = { version = "2", features = [] }
# 系统文件选择对话框（"选择视频"按钮用）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ---- Concat 引擎运行时核心（本地源码二开 / vendor 依赖）----
# 原项目：https://github.com/jub0t/Concat （作者 Jareer Abdullah，AGPL-3.0-or-later）
# 来源版本：tag v0.2.12 / commit 995b205492f2da908cc8aa8c83812008b10ae22f
#
# 路线 B：Concat 完整源码已下载到本项目 vendor/Concat/ 目录内，
# 通过本地 path 依赖引用，可直接在 vendor/Concat 源码上做定制修改。
# 源码下载/更新请用项目根目录的 更新Concat源码.ps1 脚本。
#
# 当前引入引擎的运行时核心两件套：
#   concat-core    时间/时间线/项目数据模型（零依赖）
#   concat-media   真正链接 FFmpeg 的视频读取与探测（probe）
# 不引入 concat 的 Slint 图形界面（会与 Tauri 外壳冲突），也不引入
# ONNX/GPU 等更重的可选模块。构建前需安装 FFmpeg 开发库
# （Windows 可运行项目根目录的 安装FFmpeg.ps1 一键装 8.1.3 版），详见 BUILD.md。
concat-core = { path = "../vendor/Concat/src/crates/concat-core" }
concat-media = { path = "../vendor/Concat/src/crates/concat-media" }
concat-project = { path = "../vendor/Concat/src/crates/concat-project" }
# 完整剪辑内核（会话/预览/导出/播放/工程），不含 Slint 界面，可被 Tauri 直接驱动
concat-host = { path = "../vendor/Concat/src/crates/concat-host" }
# base64：把预览帧的 RGBA 编码成 data URL 交给网页显示
base64 = "0.22"
# png：把预览帧编码成 PNG
png = "0.17"

[features]
default = []
