<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>新窗口开场提示词 - CreatorBox App/PC 开发</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background: #f6f1e9; margin: 0; padding: 24px; }
  .card { max-width: 860px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 20px; color: #b45309; margin: 0 0 4px; }
  .note { font-size: 13px; color: #8a857c; margin-bottom: 16px; }
  textarea { width: 100%; box-sizing: border-box; height: 260px; font-family: Consolas, monospace;

  button:hover { background: #d17a08; }
  #tip { display: inline-block; margin-left: 12px; font-size: 13px; color: #22a05a; opacity: 0; transition: opacity .3s; }
</style>
</head>
<body>
<div class="card">

  <textarea id="prompt" readonly>

  </textarea>
  <div>
    <button onclick="copyIt()">一键复制</button>
    <span id="tip">✓ 已复制到剪贴板</span>
  </div>
</div>
<script>
function copyIt() {
  const ta = document.getElementById('prompt');
  ta.select();
  let ok = false;
  try {
    ok = document.execCommand('copy');
  } catch (e) {}
  if (!ok && navigator.clipboard) {
    navigator.clipboard.writeText(ta.value).then(showTip);
    return;
  }
  if (ok) showTip();
}
function showTip() {
  const t = document.getElementById('tip');
  t.style.opacity = 1;
  setTimeout(() => t.style.opacity = 0, 2500);
}
</script>
